server:
  port: 8080

spring:
  application:
    name: em-backend

  config:
    import: optional:classpath:application-secrets.yml

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  main:
    allow-bean-definition-overriding: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/em}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/callback}
    registration-uri: ${OAUTH2_REGISTRATION_URI:http://localhost:5173/oauth/complete-registration}
  jwt:
    secret: ${JWT_SECRET:YkVuIHNvbWUgYmFzZTY0IGZvciBkZXYgZW52aXJvbm1lbnQgb25seQ==}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  uploads:
    path: ${UPLOADS_PATH:./uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.brenis.em: ${LOG_LEVEL:DEBUG}
    org.springframework.security: INFO